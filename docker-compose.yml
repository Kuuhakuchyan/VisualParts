services:
  # ========== MQTT Broker ==========
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"      # MQTT
      - "8081:8081"      # MQTT (校园网备用)
      - "127.0.0.1:9001:9001"      # WebSocket, exposed through Nginx when needed
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  # ========== PostgreSQL + PostGIS + TimescaleDB + pgvector ==========
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: postgres_iot
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: iot_platform
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: ${PG_PASS:?Set PG_PASS in .env}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # ========== Python MQTT -> PG 桥接 ==========
  bridge:
    build: ./bridge
    container_name: mqtt_bridge
    depends_on:
      - mosquitto
      - postgres
    environment:
      PYTHONUNBUFFERED: "1"
      # ---- 本地开发 (WSL Docker) ----
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      # ---- 阿里云生产 (上线时取消注释, 注释上面两行) ----
      # MQTT_BROKER: "weather.nogamenolife.cn"
      # MQTT_PORT: "1883"
      MQTT_USER: bridge
      MQTT_PASS: ${MQTT_BRIDGE_PASS:?Set MQTT_BRIDGE_PASS in .env}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: iot_platform
      PG_USER: iot_user
      PG_PASS: ${PG_PASS:?Set PG_PASS in .env}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ========== 可视化 ==========
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      # ---- 本地开发 ----
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000/}
      # ---- 阿里云生产 (上线时取消注释, 注释上面) ----
      # GF_SERVER_ROOT_URL: http://weather.nogamenolife.cn/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-false}
      PG_PASS: ${PG_PASS:?Set PG_PASS in .env}
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - postgres
    restart: unless-stopped

  # ========== FastAPI 对外服务 ==========
  api:
    build: ./api
    container_name: iot_api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # ---- 本地开发 (SSH 隧道 → 云 PG) ----
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      # ---- 本地 PG (不用隧道时取消注释, 注释上面两行) ----
      # PG_HOST: postgres
      # PG_PORT: "5432"
      PG_DB: iot_platform
      PG_USER: iot_user
      PG_PASS: ${PG_PASS:?Set PG_PASS in .env}
      PG_POOL_MIN: ${PG_POOL_MIN:-2}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      API_WRITE_TOKEN: ${API_WRITE_TOKEN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

