server {
    listen 80;
    server_name aic.nogamenolife.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name aic.nogamenolife.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/aic.nogamenolife.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aic.nogamenolife.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/microclimate-aic;
    index index.html;
    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn weather_addr 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; connect-src 'self' https://tiles.openfreemap.org https://*.openfreemap.org https://demotiles.maplibre.org; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

    location ~* /\.(?:env|git|hg|svn) { deny all; }
    location ~* \.(?:bak|old|orig|save|sql|sqlite|db|log|ini|conf|map|pyc)$ { deny all; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # The anonymous shell also handles a direct /#screen link.
    location = / { rewrite ^ /aic/index.html last; }
    location = /home.html { return 302 /aic/home.html; }
    location = /journal.html { return 302 /aic/journal.html; }
    location = /index.html { rewrite ^ /aic/index.html last; }
    location ^~ /decision { return 404; }
    location /aic/ { try_files $uri $uri/ =404; expires -1; }
    location /ui-fonts/ { expires -1; }
    location = /logo.png { expires -1; }
    location = /release.json { expires -1; }
    location ^~ /author { return 404; }
    location = /monitor { return 404; }
    location = /sensors { return 404; }
    location = /logs { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /cesium/Widgets/ { try_files $uri =404; expires 1y; }
    location /data/ { try_files $uri =404; expires -1; }

    # Real UGV/UAV telemetry is project-only; the anonymous competition edition
    # keeps simulation endpoints but never exposes device ingestion.
    location = /api/weather/telemetry { return 404; }
    location ^~ /api/weather/telemetry/ { return 404; }
    location = /api/weather/mobile-observations { return 404; }
    location ^~ /api/weather/mobile-observations/ { return 404; }

    # Competition has its own process, state and upstream access policy.
    location /api/weather/ {
        limit_req zone=weather_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host aic.nogamenolife.cn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
