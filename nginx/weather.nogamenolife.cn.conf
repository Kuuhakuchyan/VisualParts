limit_req_zone $binary_remote_addr zone=weather_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=weather_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=weather_write:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=weather_addr:10m;

server {
    listen 80;
    server_name weather.nogamenolife.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name weather.nogamenolife.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/weather.nogamenolife.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.nogamenolife.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    limit_conn weather_addr 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
    resolver_timeout 5s;

    location ~* /\.(?:env|git|hg|svn) {
        deny all;
    }

    location ~* \.(?:bak|old|orig|save|sql|sqlite|db|log|ini|conf|map|pyc)$ {
        deny all;
    }

    location ~ ^/tiles/world-topo/([0-9]+)/([0-9]+)/([0-9]+)$ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/$1/$2/$3;
        proxy_ssl_server_name on;
        proxy_set_header Host server.arcgisonline.com;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ ^/tiles/world-imagery/([0-9]+)/([0-9]+)/([0-9]+)$ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$1/$2/$3;
        proxy_ssl_server_name on;
        proxy_set_header Host server.arcgisonline.com;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /author {
        return 301 /author/;
    }

    location = /monitor {
        return 301 /;
    }

    location = /portal {
        return 301 /;
    }

    location /author/_astro/ {
        alias /var/www/weather-author/_astro/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /author/media/ {
        alias /var/www/weather-author/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /author/ {
        alias /var/www/weather-author/;
        index index.html;
        try_files $uri $uri/ /author/404.html;
    }

    location = /decision {
        return 301 /decision/;
    }

    location /decision/cesium/ {
        alias /var/www/microclimate-decision/decision/cesium/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /decision/ {
        alias /var/www/microclimate-decision/;
        index index.html;
        try_files $uri $uri/ /decision/index.html;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /api/simulation/ {
        limit_req zone=weather_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/weather/ {
        limit_req zone=weather_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/tracking/ {
        limit_req zone=weather_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/backfill {
        limit_req zone=weather_write burst=10 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=weather_web burst=120 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
