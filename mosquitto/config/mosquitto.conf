# MQTT 基础
listener 1883
protocol mqtt
max_connections 200
max_packet_size 1048576
max_inflight_messages 20
max_queued_messages 100

# WebSocket (Grafana MQTT 数据源需要)
listener 9001
protocol websockets

# 校园网备用明文 MQTT 端口。Docker Compose 仅绑定 127.0.0.1，公网生产阶段仍建议迁移到 MQTTS/WSS。
listener 8081
protocol mqtt

# 持久化
persistence true
persistence_location /mosquitto/data

# 日志
log_dest stdout
log_type all
connection_messages false

# 禁止匿名，启用密码
allow_anonymous false
password_file /mosquitto/config/passwd
